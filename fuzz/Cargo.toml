[package]
name = "qrcode-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
libfuzzer-sys = "0.4"

[dependencies.qrcode]
path = ".."

# `cargo fuzz` builds these itself.
[workspace]
members = ["."]

[profile.release]
debug = true
# The whole point is to catch arithmetic that silently wraps in release builds.
overflow-checks = true

[[bin]]
name = "encode"
path = "fuzz_targets/encode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "render"
path = "fuzz_targets/render.rs"
test = false
doc = false
bench = false

[lints.clippy]
unwrap_used = "allow"
