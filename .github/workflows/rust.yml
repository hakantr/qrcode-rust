name: Rust

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        rustc: [1.95.0, stable] # MSRV and current stable rustc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rustc }}
      - run: cargo check --all-targets

  test:
    name: Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # `bench` is deliberately excluded: it needs the unstable `test` crate,
        # so it builds on nightly only -- which is also why `--all-features`
        # cannot be used anywhere in this workflow.
        features: ["", "--no-default-features", "--no-default-features --features std"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test ${{ matrix.features }}

  no_panic:
    name: No-panic sweep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Release is the profile the guarantee is about: the numeric conversions
      # used to check only under `debug_assertions` and wrap silently otherwise.
      - run: cargo test --release --test no_panic
      - run: cargo test --release --no-default-features --test no_panic

  fuzz:
    name: Fuzz (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@cargo-fuzz
      # A short campaign per target on every push; long runs happen out of band.
      # The rss limit is explicit because a caller is allowed to ask for an
      # image far larger than the runner has memory for -- that is documented
      # behaviour, not a finding, and the targets stay inside it by design.
      - run: cargo fuzz run encode -- -max_total_time=120 -rss_limit_mb=2048
      - run: cargo fuzz run render -- -max_total_time=120 -rss_limit_mb=2048

  fmt:
    name: Rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --no-default-features -- -D warnings

  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --no-deps
