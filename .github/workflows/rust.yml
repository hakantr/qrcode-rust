name: Rust

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Denetim
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        rustc: [1.95.0, stable] # MSRV ve güncel kararlı rustc
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rustc }}
      - run: cargo check --all-features --all-targets

  test:
    name: Test paketi
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Özelliklerin tamamını ve en küçük `no_std` bileşimlerini ayrı ayrı sına.
        features: ["--all-features", "--no-default-features", "--no-default-features --features std"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test ${{ matrix.features }}

  no_panic:
    name: Paniksiz API taraması
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Garanti release profilini de kapsar: sayısal dönüşümler eskiden yalnızca
      # `debug_assertions` altında denetleniyor, aksi hâlde sessizce sarılıyordu.
      - run: cargo test --release --test no_panic
      - run: cargo test --release --no-default-features --test no_panic

  fuzz:
    name: Fuzz (hızlı tarama)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - uses: taiki-e/install-action@cargo-fuzz
      # Her push'ta hedef başına kısa bir tur; uzun çalışmalar ayrıca yürütülür.
      # RSS sınırı açıktır: çağıran, runner belleğinden büyük ama piksel sınırının
      # altında bir görüntü isteyebilir. Bu belgelenmiş davranıştır; fuzz hedefleri
      # tasarım gereği bu bütçenin içinde kalır.
      - run: cargo fuzz run encode -- -max_total_time=120 -rss_limit_mb=2048
      - run: cargo fuzz run render -- -max_total_time=120 -rss_limit_mb=2048

  fmt:
    name: Biçim
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --all-targets --no-default-features -- -D warnings

  docs:
    name: Belgeler
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo doc --no-deps
