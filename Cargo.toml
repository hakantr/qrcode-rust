[package]
name = "qrcode"
description = "Rust ile QR kodu kodlayıcı"
license = "MIT OR Apache-2.0"
version = "0.15.0"
edition = "2024"
rust-version = "1.95.0"
authors = ["kennytm <kennytm@gmail.com>"]
keywords = ["qrcode"]
categories = ["encoding", "multimedia::images"]
repository = "https://github.com/kennytm/qrcode-rust"
readme = "README.md"
documentation = "https://docs.rs/qrcode"
exclude = [
    "fuzz/**",
    ".github/**", ".gitignore",
]

[badges]
maintenance = { status = "passively-maintained" }

# `src/lib.rs` özellik rozetlerini `doc_auto_cfg` ile üretiyor; bu, yalnızca
# `docsrs` cfg'i ayarlandığında etkinleşir. Bu bölüm olmadan docs.rs onu asla
# tanımlamaz ve rozetler sessizce hiç görünmez.
[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]

# Kamu API'sine verilen geçersiz dış girdiler, olağan çalışma zamanı hataları ve
# desteklenmeyen seçenekler kasıtlı olarak paniklemez; yapılandırılmış bir
# `QrError` döndürür. Kalan panik üretebilen yapılar yalnızca belgelenmiş çağıran
# sözleşmeleri veya kütüphanenin iç değişmezleri içindir ve her biri gerekçeli bir
# `#[expect(...)]` ile açıkça işaretlenir. Çalışma zamanı denetimleri için
# `tests/no_panic.rs` dosyasına bakın.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
indexing_slicing = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unreachable = "deny"
todo = "deny"
unimplemented = "deny"
exit = "deny"
must_use_candidate = "allow"

[dependencies]
image = { version = "0.25", default-features = false, optional = true }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png"] }

[features]
default = ["std", "image", "svg", "pic", "eps"]
image = ["dep:image", "std"]
std = []
svg = []
pic = []
eps = []

[[bin]]
name = "qrencode"

[[example]]
name = "encode_image"
required-features = ["image"]

[[example]]
name = "encode_string"

[[example]]
name = "encode_svg"
required-features = ["svg"]

[[example]]
name = "encode_pic"
required-features = ["pic"]

[[example]]
name = "encode_eps"
required-features = ["eps"]
